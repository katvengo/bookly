@if (errorMessage()) {
  <span class="error">{{ errorMessage() }}</span>
}
  <form [formRoot]="loginForm" (submit)="onLoginSubmit()">
    <label>Email</label>

    <app-input [formField]="loginForm.email" [isError]="loginForm.email().touched() && loginForm.email().invalid()"></app-input>
    @if (loginForm.email().touched() && loginForm.email().invalid()) {
      @for (error of loginForm.email().errors(); track $index) {
       <span class="error">
        {{ error.message }}
      </span>
      }

    }
      <label>Password</label>
      <app-input [formField]="loginForm.password"></app-input>

    <app-button [type]="'submit'" [disabled]="loginForm().invalid()">Log in to your account</app-button>

    </form>
