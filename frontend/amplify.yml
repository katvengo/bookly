version: 1

env:
  variables:
    NODE_VERSION: 24.21.0
    ANGULAR_VERSION: 21.2.24
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g@angular/cli@ANGULAR_VERSION
        - cd frontend
        - npm install
        - ng build
    # IMPORTANT - Please verify your build commands
    build:
      commands: []
  artifacts:
    baseDirectory: dist/frontend
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*