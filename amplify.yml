version: 1
env:
  variables:
    NODE_VERSION: 24.21.0
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24.21.0
        - nvm use 24.21.0
        - cd frontend
        - npm ci
    build:
      commands:
        # Amplify keeps cwd across phases; we are already in frontend/.
        - nvm use 24.21.0
        - npm run build
        - test -f dist/frontend/index.html
        - find dist/frontend -maxdepth 1 -name 'main-*.js' | grep -q .
        # Copy artifacts to a repo-root publish/ folder so baseDirectory is unambiguous.
        - rm -rf ../publish
        - mkdir -p ../publish
        - cp -R dist/frontend/. ../publish/
        - ls -la ../publish
  artifacts:
    baseDirectory: publish
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
