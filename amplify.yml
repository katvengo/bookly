version: 1

env:
  variables:
    NODE_VERSION: 24.21.0
    ANGULAR_VERSION: 21.2.24

frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm install -g @angular/cli@$ANGULAR_VERSION
        - npm install
    build:
      commands:
        - ng build --configuration production --base-href /
  artifacts:
    baseDirectory: frontend/dist/frontend
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Enforce clean dependencies installation using npm ci
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Build the Angular application for production production
        - npx ng build --configuration=production --base-href "/frontend" --deploy-url "https://main.d1d91jrlaov4rt.amplifyapp.com/"
  artifacts:
    # Points to the standard Angular build output path
    baseDirectory: dist/frontend/browser/
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*