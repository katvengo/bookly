version: 1
env:
  variables:
    NODE_VERSION: 24.21.0
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24.21.0
        - nvm use 24.21.0
        - cd frontend
        - npm ci
    build:
      commands:
        - nvm use 24.21.0
        # Re-enter app dir in case the build image resets cwd between phases.
        - cd frontend
        - npm run build
        # Fail the build if the publish directory is missing expected SPA artifacts.
        - test -f dist/frontend/index.html
        - test -n "$(find dist/frontend -maxdepth 1 -name 'main-*.js' -print -quit)"
        - ls -la dist/frontend
  artifacts:
    # Angular application builder output (flattened; see angular.json outputPath.browser)
    baseDirectory: frontend/dist/frontend
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
