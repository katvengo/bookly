version: 1

env:
  variables:
    NODE_VERSION: 24.21.0
    ANGULAR_VERSION: 22.2.0
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - nvm install 24.21.0 # Install the correct Node.js version
        - nvm use 24.21.0     # Use the correct Node.js version
        - npm install -g @angular/cli@22.2.0
        - npm install
    build:
      commands:
         - npx ng build --configuration=production --base-href "/frontend"
  artifacts:
    baseDirectory: frontend/dist/frontend/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
runtime:
nodejs: 24.21.0
