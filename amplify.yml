version: 1

env:
  variables:
    NODE_VERSION: 24.21.0
    ANGULAR_VERSION: 21.2.24

frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm install -g @angular/cli@$ANGULAR_VERSION
        - npm install
    build:
      commands:
         - npx ng build --configuration=production --base-href "/frontend" --deploy-url "https://main.d1d91jrlaov4rt.amplifyapp.com/"
  artifacts:
    baseDirectory: frontend/dist/frontend
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
