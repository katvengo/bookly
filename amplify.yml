version: 1

env:
  variables:
    NODE_VERSION: 24.21.0
    ANGULAR_VERSION: 21.2.24

frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm install -g @angular/cli@$ANGULAR_VERSION
        - npm install
    build:
      commands:
         - ng build --prod
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*